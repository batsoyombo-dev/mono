# Local infrastructure only. Apps run on the host with `bun run dev`.
services:
    postgres:
        image: postgres:18-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: mono
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            retries: 10

    redis:
        image: redis:8-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data

    # Catches every outgoing email. Inbox UI: http://localhost:8025
    mailpit:
        image: axllent/mailpit:v1.33
        ports:
            - "1025:1025"
            - "8025:8025"

volumes:
    postgres-data:
    redis-data:
